<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Location Access</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:#ffffff;color:#111827;min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.box{width:100%;max-width:420px}
h1{font-size:22px;font-weight:700;margin-bottom:8px;text-align:center}
.status{font-size:14px;color:#6b7280;text-align:center;line-height:1.5;margin-bottom:22px;min-height:21px}
.btn{
  width:100%;border:0;border-radius:10px;padding:15px 18px;
  font-size:16px;font-weight:700;color:#fff;cursor:pointer;
  background:#2563eb;transition:background .15s,opacity .15s;
}
.btn:hover{background:#1d4ed8}
.btn:active{background:#1e40af}
.btn:disabled{opacity:.55;cursor:default}
.btn.stop{background:#dc2626}
.btn.stop:hover{background:#b91c1c}
.list{border:1px solid #e5e7eb;border-radius:10px;margin-top:20px;overflow:hidden}
.list[hidden]{display:none}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 16px;font-size:14px;border-bottom:1px solid #f1f5f9}
.row:last-child{border-bottom:0}
.row span{color:#6b7280}
.row b{color:#111827;font-weight:700;font-variant-numeric:tabular-nums;
  font-family:ui-monospace,Consolas,monospace;font-size:13.5px}
.foot{margin-top:18px;font-size:12px;color:#9ca3af;text-align:center}
</style>
</head>
<body>
  <div class="box">
    <h1>Enable Location</h1>
    <p class="status" id="status">Requesting permission… tap “Allow”.</p>
    <button class="btn" id="btn">Allow Location</button>
    <div class="list" id="list" hidden>
      <div class="row"><span>Latitude</span><b id="lat">—</b></div>
      <div class="row"><span>Longitude</span><b id="lon">—</b></div>
      <div class="row"><span>Accuracy</span><b id="acc">—</b></div>
      <div class="row"><span>Updated</span><b id="upd">—</b></div>
    </div>
    <p class="foot">Your location stays on this device.</p>
  </div>

<script>
(function () {
  'use strict';
  var btn = document.getElementById('btn');
  var statusEl = document.getElementById('status');
  var list = document.getElementById('list');
  var latEl = document.getElementById('lat');
  var lonEl = document.getElementById('lon');
  var accEl = document.getElementById('acc');
  var updEl = document.getElementById('upd');

  var watchId = null;
  var hiWatch = null;
  var hiTimer = null;
  var tickTimer = null;
  var lastTs = 0;
  var running = false;

  function setStatus(t) { statusEl.textContent = t; }
  function ago(ts) {
    if (!ts) return '—';
    var d = Math.max(0, Math.floor(Date.now() / 1000) - ts);
    if (d < 5) return 'just now';
    if (d < 60) return d + 's ago';
    return Math.floor(d / 60) + 'm ago';
  }
  function secureOk() {
    return window.isSecureContext || location.hostname === 'localhost' ||
           location.hostname === '127.0.0.1' || location.hostname === '::1';
  }

  function onFix(pos) {
    var c = pos.coords;
    lastTs = Math.floor(Date.now() / 1000);
    list.hidden = false;
    latEl.textContent = c.latitude.toFixed(6);
    lonEl.textContent = c.longitude.toFixed(6);
    accEl.textContent = '±' + Math.round(c.accuracy || 0) + ' m';
    updEl.textContent = ago(lastTs);
    setStatus('Location active.');
    btn.textContent = 'Stop';
    btn.classList.add('stop');
    btn.disabled = false;
  }

  function onErr(e) {
    if (e && e.code === 1) {
      stopWatching(true);
      setStatus('Permission denied. Enable location for this site in browser settings, then tap Try again.');
      btn.textContent = 'Try again';
      btn.classList.remove('stop');
      btn.disabled = false;
      return;
    }
    if (e && e.code === 3) { setStatus('Waiting for GPS fix… keep Location/GPS ON.'); return; }
    setStatus('Getting location… make sure Location/GPS is ON.');
  }

  function clearWatches() {
    if (watchId !== null && navigator.geolocation) navigator.geolocation.clearWatch(watchId);
    if (hiWatch !== null && navigator.geolocation) navigator.geolocation.clearWatch(hiWatch);
    watchId = null; hiWatch = null;
    if (hiTimer) { clearTimeout(hiTimer); hiTimer = null; }
    if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
  }

  function stopWatching(userStopped) {
    running = false;
    clearWatches();
    if (userStopped) {
      setStatus('Location stopped. Tap to start again.');
      btn.textContent = 'Allow Location';
      btn.classList.remove('stop');
      btn.disabled = false;
    }
  }

  function startWatch() {
    clearWatches();
    watchId = navigator.geolocation.watchPosition(onFix, onErr,
      { enableHighAccuracy: false, maximumAge: 60000, timeout: 20000 });
    hiTimer = setTimeout(function () {
      if (!running) return;
      hiWatch = navigator.geolocation.watchPosition(onFix, function () {},
        { enableHighAccuracy: true, maximumAge: 5000, timeout: 60000 });
    }, 5000);
    tickTimer = setInterval(function () { if (lastTs) updEl.textContent = ago(lastTs); }, 1000);
  }

  function start() {
    if (running) return;
    if (!navigator.geolocation) {
      setStatus('This browser does not support location. Please use Chrome.');
      return;
    }
    if (!secureOk()) {
      setStatus('Location needs a secure page (https). Open this via https link.');
      return;
    }
    running = true;
    btn.disabled = true;
    btn.textContent = 'Requesting…';
    btn.classList.remove('stop');
    setStatus('Requesting permission… tap “Allow”.');
    startWatch();
  }

  btn.addEventListener('click', function () {
    if (running) stopWatching(true);
    else start();
  });

  // Safety net: a tap/click anywhere also triggers the permission request,
  // in case a browser blocks auto-request on page load.
  document.addEventListener('click', function (e) {
    if (e.target === btn) return;
    if (!running) start();
  }, true);

  function autoStart() {
    if (navigator.permissions && navigator.permissions.query) {
      navigator.permissions.query({ name: 'geolocation' }).then(function (s) {
        if (s.state === 'denied') {
          setStatus('Location is blocked for this site. Enable it in browser settings, then tap Try again.');
          btn.textContent = 'Try again';
        } else {
          start();
        }
      }).catch(function () { start(); });
    } else {
      start();
    }
  }

  // Auto-request permission as soon as the page opens (no click needed).
  window.addEventListener('load', function () { setTimeout(autoStart, 200); });
})();
</script>
</body>
</html>
